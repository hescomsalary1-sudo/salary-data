<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Salary Prompt</title>
<style>
/* --- MODERN ELECTRIC BLUE & CYAN DESIGN SYSTEM --- */
:root {
    --primary-gradient: radial-gradient(circle at 50% 50%, #1e3a8a 0%, #1e1b4b 35%, #0f172a 70%, #020617 100%);
    --accent-emerald: #06b6d4;
    --accent-gold: #38bdf8;
    --glass-border: rgba(255, 255, 255, 0.12);
    --text-light: #ffffff;
    --text-muted: #bae6fd;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: var(--primary-gradient);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    color: var(--text-light);
}

/* --- AMBIENT LIGHT MESH --- */
.bg1, .bg2 {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
}
.bg1 {
    width: 450px;
    height: 450px;
    left: -100px;
    top: -100px;
    background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(6, 182, 212, 0) 70%);
    animation: ambientFloat 8s ease-in-out infinite alternate;
}
.bg2 {
    width: 350px;
    height: 350px;
    right: -100px;
    bottom: -100px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(56, 189, 248, 0) 70%);
    animation: ambientFloat 12s ease-in-out infinite alternate-reverse;
}

/* --- CENTRAL BRAND ARCHITECTURE --- */
.container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    width: 100%;
    max-width: 360px;
}

.logoWrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* --- RUNNING INNER DASHED TRACK --- */
.ring {
    position: absolute;
    inset: -15px;
    border: 1.5px dashed rgba(56, 189, 248, 0.4);
    border-radius: 50%;
    animation: spinRing 24s linear infinite;
}

/* --- STATIONARY OUTER TRACK --- */
.ring-outer {
    position: absolute;
    inset: -22px;
    border: 1px solid rgba(6, 182, 212, 0.2);
    border-radius: 50%;
}

/* --- LOGO CARD --- */
.logo {
    width: 100px;
    height: 100px;
    border-radius: 28px;
    background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 50%, #38bdf8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 52px;
    font-weight: 700;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15), 0 15px 35px rgba(37, 99, 235, 0.4);
    animation: floatingPulse 3s ease-in-out infinite;
    user-select: none;
}

/* --- KANNADA BRANDING TITLE --- */
.brand-title {
    margin-top: 32px;
    font-size: 20px;
    font-weight: 600;
    color: var(--text-light);
    text-align: center;
    line-height: 1.4;
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
    letter-spacing: 0.2px;
}

/* --- SUBTITLE TEXT --- */
.brand-subtitle {
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.8;
}

/* --- SMOOTH PROGRESS BAR CONTAINER --- */
.progress-wrap {
    width: 80%;
    max-width: 240px;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    margin-top: 36px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #2563eb, #38bdf8);
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    animation: fillProgress 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

/* --- KEYFRAME SYSTEMS --- */
@keyframes fillProgress {
    0% { width: 0%; }
    100% { width: 100%; }
}

@keyframes spinRing {
    to { transform: rotate(360deg); }
}

@keyframes floatingPulse {
    0% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.02); }
    100% { transform: translateY(0) scale(1); }
}

@keyframes ambientFloat {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 20px) scale(1.1); }
}

/* --- OPTIMIZATION BREAKPOINT --- */
@media(max-width: 400px){
    .logo { width: 85px; height: 85px; font-size: 44px; border-radius: 24px; }
    .ring { inset: -12px; }
    .ring-outer { inset: -18px; }
    .brand-title { font-size: 18px; margin-top: 28px; }
    .progress-wrap { margin-top: 28px; width: 75%; }
}
</style>
</head>
<body>

<div class="bg1"></div>
<div class="bg2"></div>

<div class="container">
    <div class="logoWrap">
        <div class="ring-outer"></div>
        <div class="ring"></div>
        <div class="logo">&#8377;</div>
    </div>
    <div class="brand-title">ಕಾರ್ಯ ಮತ್ತು ಪಾಲನಾ ವಿಭಾಗ, ಹೆಸ್ಕಾಂ, ಶಿರಸಿ</div>
    <div class="brand-subtitle">Salary Prompt</div>
    
    <!-- PROGRESS BAR ELEMENT -->
    <div class="progress-wrap">
        <div class="progress-bar"></div>
    </div>
</div>

<!-- RUNTIME ROUTING TRIGGER -->
<script>
setTimeout(function(){window.location.href="login.html";},3000);
</script>
</body>
</html>
