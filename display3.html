<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LM Pending Arrears (> ₹1000) - HESCOM Siddapur</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Noto Sans Kannada', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
}

body {
  background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
  min-height: 100vh;
  color: #f8fafc;
  padding-bottom: 30px;
  position: relative;
}

.bg-glow-1 {
  position: absolute;
  top: -100px;
  right: -50px;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(244, 63, 94, 0.25) 0%, rgba(0,0,0,0) 70%);
  pointer-events: none;
  z-index: 0;
}

.bg-glow-2 {
  position: absolute;
  bottom: 0;
  left: -80px;
  width: 350px;
  height: 350px;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(0,0,0,0) 70%);
  pointer-events: none;
  z-index: 0;
}

.navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  width: 100%;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-badge {
  width: 38px;
  height: 38px;
  background: linear-gradient(135deg, #f43f5e, #e11d48);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.2);
  flex-shrink: 0;
}

.brand-text h2 {
  font-size: 0.88rem;
  font-weight: 700;
  color: #f8fafc;
  line-height: 1.2;
}

.brand-text p {
  font-size: 0.7rem;
  color: #f43f5e;
  font-weight: 600;
}

.nav-buttons {
  display: flex;
  gap: 8px;
}

.btn-nav {
  background: rgba(255, 255, 255, 0.08);
  color: #e2e8f0;
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.75rem;
  font-weight: 600;
  transition: all 0.2s ease;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.btn-nav:active {
  transform: scale(0.95);
  background: rgba(255, 255, 255, 0.2);
}

.btn-logout {
  background: rgba(239, 68, 68, 0.15);
  color: #fca5a5;
  border: 1px solid rgba(239, 68, 68, 0.3);
}

.container {
  width: 100%;
  max-width: 520px;
  margin: 16px auto 0 auto;
  padding: 0 14px;
  position: relative;
  z-index: 10;
}

.info-card {
  background: linear-gradient(135deg, rgba(30, 27, 75, 0.6), rgba(15, 23, 42, 0.8));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
  margin-bottom: 16px;
  animation: fadeInDown 0.3s ease forwards;
}

.info-item label {
  font-size: 0.68rem;
  text-transform: uppercase;
  color: #94a3b8;
  letter-spacing: 0.8px;
  display: block;
  margin-bottom: 2px;
}

.info-item span {
  font-size: 1.1rem;
  font-weight: 700;
  color: #f43f5e;
  text-shadow: 0 2px 8px rgba(244, 63, 94, 0.3);
}

.controls-card {
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  padding: 14px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
  margin-bottom: 20px;
  animation: fadeInUp 0.3s ease forwards;
}

.form-group label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  color: #cbd5e1;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

input {
  width: 100%;
  padding: 11px 14px;
  font-size: 0.88rem;
  color: #f8fafc;
  background: rgba(30, 41, 59, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  outline: none;
  transition: all 0.2s ease;
}

input:focus {
  border-color: #f43f5e;
  background: rgba(30, 41, 59, 0.95);
  box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.2);
}

input::placeholder {
  color: #64748b;
}

.data-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Consumer Card Wrapper */
.consumer-card-wrapper {
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-left: 4px solid #f43f5e;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
  transition: all 0.2s ease;
}

.consumer-card-wrapper.expanded {
  border-color: rgba(244, 63, 94, 0.4);
  border-left-width: 4px;
  background: rgba(15, 23, 42, 0.9);
}

.consumer-summary-header {
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
}

.consumer-summary-header:active {
  background: rgba(255, 255, 255, 0.05);
}

.card-left {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 65%;
}

.rr-badge {
  font-size: 0.88rem;
  font-weight: 700;
  color: #38bdf8;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tc-tag {
  font-size: 0.68rem;
  font-weight: 600;
  color: #a7f3d0;
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid rgba(16, 185, 129, 0.3);
  padding: 2px 8px;
  border-radius: 6px;
  display: inline-block;
  width: fit-content;
}

.consumer-name {
  font-size: 0.82rem;
  color: #cbd5e1;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.cb-amount {
  font-size: 0.98rem;
  font-weight: 700;
  color: #f43f5e;
  text-align: right;
}

.cb-amount span {
  display: block;
  font-size: 0.62rem;
  color: #94a3b8;
  text-transform: uppercase;
  font-weight: 600;
}

.arrow-icon {
  width: 26px;
  height: 26px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  color: #94a3b8;
  transition: transform 0.25s ease;
}

.consumer-card-wrapper.expanded .arrow-icon {
  transform: rotate(90deg);
  background: rgba(244, 63, 94, 0.2);
  color: #f43f5e;
}

/* In-Card Details Grid Section */
.details-panel {
  display: none;
  padding: 14px 16px;
  border-top: 1px dashed rgba(255, 255, 255, 0.1);
  background: rgba(2, 6, 23, 0.4);
}

.consumer-card-wrapper.expanded .details-panel {
  display: block;
  animation: fadeIn 0.25s ease forwards;
}

.details-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.grid-item {
  background: rgba(30, 41, 59, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 8px;
  padding: 8px 10px;
}

.grid-item.full-width {
  grid-column: span 2;
}

.grid-item-label {
  font-size: 0.65rem;
  color: #94a3b8;
  text-transform: uppercase;
  font-weight: 600;
  letter-spacing: 0.4px;
  margin-bottom: 2px;
}

.grid-item-value {
  font-size: 0.82rem;
  color: #f8fafc;
  font-weight: 600;
  word-break: break-word;
}

.empty-state {
  text-align: center;
  padding: 36px 20px;
  color: #94a3b8;
  background: rgba(15, 23, 42, 0.6);
  border-radius: 16px;
  border: 1px dashed rgba(255, 255, 255, 0.12);
  font-size: 0.85rem;
}

#loader-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(2, 6, 23, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 1000;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.spinner-container {
  position: relative;
  width: 42px;
  height: 42px;
  margin-bottom: 12px;
}

.spinner-outer {
  width: 100%;
  height: 100%;
  border: 3px solid rgba(244, 63, 94, 0.2);
  border-top-color: #f43f5e;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeInDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<div id="loader-overlay">
  <div class="spinner-container">
    <div class="spinner-outer"></div>
  </div>
  <div id="loader-text" style="color: #f43f5e; font-weight: 600; font-size: 0.85rem;">Fast Loading Arrears (> ₹1000)...</div>
</div>

<div class="navbar">
  <div class="nav-brand">
    <div class="brand-badge">💰</div>
    <div class="brand-text">
      <h2>ಬಾಕಿ ವರದಿ (> ₹1000)</h2>
      <p>HESCOM Siddapur</p>
    </div>
  </div>
  <div class="nav-buttons">
    <a href="menu2.html" class="btn-nav">Menu</a>
    <button class="btn-nav btn-logout" onclick="logout()">Logout</button>
  </div>
</div>

<div class="container">
  <div class="info-card">
    <div class="info-item">
      <label>LM Name</label>
      <span id="lmName" style="color: #38bdf8;">-</span>
    </div>
    <div class="info-item" style="text-align: right;">
      <label>Consumers (> ₹1000 CB)</label>
      <span id="totalOver1000">0</span>
    </div>
  </div>

  <div class="controls-card">
    <div class="form-group">
      <label for="searchBox">Filter List</label>
      <input type="text" id="searchBox" placeholder="Search RR No, TC, or Consumer Name...">
    </div>
  </div>

  <div id="dataContainer" class="data-container"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyCP_ACzGUE1JBL5UDgRMK0tbHvq489GpnNgQ-7HVzM3dTkc0cFG7j5kY9QqOJLMNbpXg/exec";

const lmName = sessionStorage.getItem("lmName");
const userMpin = sessionStorage.getItem("mpin");

if (!lmName || !userMpin) { 
  alert("Session expired. Please log in again."); 
  location.href = "login2.html"; 
}

document.getElementById("lmName").textContent = lmName;

const searchBox = document.getElementById("searchBox");
const dataContainer = document.getElementById("dataContainer");
const loaderOverlay = document.getElementById("loader-overlay");

let currentConsumerList = [];

function showLoader() { loaderOverlay.style.display = "flex"; }
function hideLoader() { loaderOverlay.style.display = "none"; }

window.onload = async function() {
  const cachedData = sessionStorage.getItem("cachedMpinArrears1000");

  if (cachedData) {
    currentConsumerList = JSON.parse(cachedData);
    updateUI(currentConsumerList);
  } else {
    await fetchSingleBatchArrears();
  }
};

async function fetchSingleBatchArrears() {
  showLoader();
  try {
    const res = await fetch(`${API_URL}?action=getMpinArrears&mpin=${encodeURIComponent(userMpin)}`);
    const data = await res.json();

    if (data.status === "success" && Array.isArray(data.arrears)) {
      // Filter list to keep only consumers with CB > 1000
      currentConsumerList = data.arrears.filter(item => Number(item.cb) > 1000);
      sessionStorage.setItem("cachedMpinArrears1000", JSON.stringify(currentConsumerList));
      updateUI(currentConsumerList);
    } else {
      showEmptyState("No consumers found with arrears > ₹1000.");
    }
  } catch (err) {
    console.error(err);
    showEmptyState("Failed to retrieve arrears data.");
  } finally {
    hideLoader();
  }
}

function updateUI(list) {
  document.getElementById("totalOver1000").textContent = list.length.toLocaleString('en-IN');
  renderConsumerList(list);
}

function renderConsumerList(list) {
  dataContainer.innerHTML = "";

  if (list.length === 0) {
    showEmptyState("No consumers found with Closing Balance > ₹1000.");
    return;
  }

  const fragment = document.createDocumentFragment();

  // Normalized list of keys to exclude to avoid duplicates
  const excludedKeys = [
    "RRNO", "RR_NO", "RR NO",
    "NAME", "CONSUMERNAME", "CONSUMER_NAME", "CONSUMER NAME",
    "SLNO", "SL_NO", "SL NO",
    "COLUMN_5", "COLUMN 5",
    "AREANAME", "AREA_NAME", "AREA NAME",
    "RD",
    "SL",
    "POLENAME", "POLE_NAME", "POLE NAME",
    "LMNAME", "LM_NAME", "LM NAME",
    "CB", "CLOSINGBALANCE", "CLOSING_BALANCE", "CLOSING BALANCE",
    "TC", "TCNO", "TC_NO", "TC NO"
  ];

  list.forEach((item, index) => {
    const cardWrapper = document.createElement("div");
    cardWrapper.className = "consumer-card-wrapper";
    cardWrapper.setAttribute("data-search", `${item.rrno || ''} ${item.name || ''} ${item.tc || ''}`);

    let gridHtml = "";

    if (item.fullData && typeof item.fullData === "object") {
      Object.keys(item.fullData).forEach(key => {
        // Clean key for robust comparison
        const cleanKey = key.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");

        // Exclude listed duplicate fields
        if (excludedKeys.some(ex => ex.replace(/[^A-Z0-9]/g, "") === cleanKey)) {
          return;
        }

        let val = item.fullData[key];
        if (val === null || val === undefined || val === "") val = "-";

        const isFullWidth = key.length > 15 || String(val).length > 20;
        gridHtml += `
          <div class="grid-item ${isFullWidth ? 'full-width' : ''}">
            <div class="grid-item-label">${key}</div>
            <div class="grid-item-value">${val}</div>
          </div>
        `;
      });
    }

    // Fallback if no extra fields exist
    if (!gridHtml) {
      gridHtml = `
        <div class="grid-item full-width">
          <div class="grid-item-label">Status</div>
          <div class="grid-item-value">No additional details</div>
        </div>
      `;
    }

    cardWrapper.innerHTML = `
      <div class="consumer-summary-header" onclick="toggleCard(${index})">
        <div class="card-left">
          <div class="rr-badge">📄 ${item.rrno || '-'}</div>
          <div class="tc-tag">TC: ${item.tc || '-'}</div>
          <div class="consumer-name">${item.name || '-'}</div>
        </div>
        <div class="card-right">
          <div class="cb-amount">
            <span>Balance CB</span>
            ₹ ${item.cb ? Math.round(item.cb).toLocaleString('en-IN') : '0'}
          </div>
          <div class="arrow-icon">➔</div>
        </div>
      </div>
      <div class="details-panel" id="details-${index}">
        <div class="details-grid">
          ${gridHtml}
        </div>
      </div>
    `;

    fragment.appendChild(cardWrapper);
  });

  dataContainer.appendChild(fragment);
}

function toggleCard(index) {
  const allCards = document.querySelectorAll('.consumer-card-wrapper');
  const targetCard = allCards[index];

  if (!targetCard) return;

  const isCurrentlyExpanded = targetCard.classList.contains('expanded');

  // Collapse all other expanded cards to maintain clean UI
  allCards.forEach(c => c.classList.remove('expanded'));

  // Toggle current card
  if (!isCurrentlyExpanded) {
    targetCard.classList.add('expanded');
  }
}

function showEmptyState(msg) {
  dataContainer.innerHTML = `
    <div class="empty-state">
      <div style="font-size: 1.8rem; margin-bottom: 6px;">📋</div>
      <div>${msg}</div>
    </div>`;
}

searchBox.onkeyup = function () {
  const term = this.value.toUpperCase().trim();
  const cards = document.querySelectorAll(".consumer-card-wrapper");

  cards.forEach(card => {
    const text = card.getAttribute("data-search").toUpperCase();
    card.style.display = text.includes(term) ? "block" : "none";
  });
};

function logout() {
  sessionStorage.clear();
  location.href = "login2.html";
}
</script>
</body>
</html>
