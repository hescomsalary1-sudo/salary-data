<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<title>Salary Prompt - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- Google Fonts: Noto Sans Kannada & Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Lucide Vector Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
/* --- MODERN AURORA DARK DESIGN SYSTEM --- */
:root {
    --primary-bg: #090d16;
    --accent-purple: #8b5cf6;
    --accent-cyan: #06b6d4;
    --accent-pink: #ec4899;
    --card-bg: rgba(17, 24, 39, 0.75);
    --modal-bg: #0f172a;
    --input-bg: rgba(15, 23, 42, 0.6);
    --glass-border: rgba(255, 255, 255, 0.12);
    --text-light: #f8fafc;
    --text-muted: #94a3b8;
    --error: #f43f5e;
    --success: #10b981;
    --radius: 20px;
    --font-family: 'Noto Sans Kannada', 'Inter', -apple-system, sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: var(--font-family);
    background-color: var(--primary-bg);
    color: var(--text-light);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
}

/* --- AURORA LIGHT ORBS --- */
.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 1;
    opacity: 0.35;
}
.orb-1 { width: 320px; height: 320px; left: -100px; top: -50px; background: #7c3aed; }
.orb-2 { width: 300px; height: 300px; right: -80px; top: 100px; background: #06b6d4; }
.orb-3 { width: 250px; height: 250px; left: 20%; bottom: -50px; background: #ec4899; }

/* --- TOP BRANDING AREA --- */
.top {
    position: relative;
    width: 100%;
    height: 26vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 2;
    padding: 20px 15px 0 15px;
    text-align: center;
}

.illustration {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url("https://hescomsalary1-sudo.github.io/salary-data/blue_image.png");
    background-size: cover;
    background-position: center;
    opacity: 0.12;
    filter: hue-rotate(200deg);
}

.brand-badge {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
    z-index: 3;
    margin-bottom: 8px;
}

.top h1 {
    color: #ffffff;
    font-size: 20px;
    font-weight: 700;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    z-index: 3;
    line-height: 1.4;
}

/* --- MAIN CONTAINER --- */
.bottom {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 0 20px;
    flex-grow: 1;
    z-index: 2;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: var(--card-bg);
    padding: 28px 24px;
    border-radius: var(--radius);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 1px rgba(255, 255, 255, 0.2);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

/* --- INPUT FIELDS --- */
.input-group {
    margin-bottom: 16px;
    position: relative;
    display: flex;
    align-items: center;
}

.input-icon {
    position: absolute;
    left: 14px;
    color: var(--text-muted);
    width: 20px;
    height: 20px;
    pointer-events: none;
}

input {
    width: 100%;
    padding: 14px 16px 14px 44px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    outline: none;
    font-size: 15px;
    font-family: var(--font-family);
    background: var(--input-bg);
    border-radius: 12px;
    color: var(--text-light);
    transition: all 0.25s ease;
}

input::placeholder {
    color: var(--text-muted);
    opacity: 0.7;
}

input:focus {
    border-color: var(--accent-purple);
    background: rgba(15, 23, 42, 0.9);
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
}

.toggle-password {
    position: absolute;
    right: 14px;
    cursor: pointer;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    transition: color 0.2s;
}

.toggle-password:hover {
    color: var(--accent-cyan);
}

/* --- BUTTONS --- */
button {
    width: 100%;
    padding: 14px;
    border: none;
    background: linear-gradient(135deg, var(--accent-purple), #6366f1);
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    font-family: var(--font-family);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
}

button:active {
    transform: translateY(0);
}

.change-btn {
    margin-top: 10px;
    background: transparent;
    color: var(--text-light);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: none;
}

.change-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.3);
    box-shadow: none;
}

/* --- FEATURES GRID --- */
.features {
    width: 100%;
    max-width: 400px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 18px;
}

.f {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 14px;
    padding: 10px 4px;
    color: var(--text-light);
    text-align: center;
    transition: all 0.3s ease;
}

.f:hover {
    background: rgba(255, 255, 255, 0.08);
    transform: translateY(-2px);
    border-color: var(--accent-cyan);
}

.f .i-box {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 4px;
    color: var(--accent-cyan);
}

.f b {
    display: block;
    font-size: 11px;
    font-weight: 600;
}

.f span {
    display: block;
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 1px;
}

/* --- ALERTS & ERRORS --- */
#error {
    color: var(--error);
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 14px;
    text-align: center;
    background: rgba(244, 63, 94, 0.12);
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid rgba(244, 63, 94, 0.25);
    display: none;
}
#error:not(:empty) {
    display: block;
}

/* --- LOADERS & MODALS --- */
#loader, #cpLoader, #changeBox, #successPopup, #errorPopup {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(9, 13, 22, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

#cpLoader, #changeBox, #successPopup, #errorPopup {
    display: none;
}

.morph-spinner {
    width: 80px;
    height: 80px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

.morph-spinner::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: var(--accent-purple);
    border-bottom-color: var(--accent-cyan);
    animation: spin 1.2s linear infinite;
}

.loader-text {
    margin-top: 24px;
    font-weight: 600;
    color: var(--text-light);
    font-size: 14px;
    letter-spacing: 1px;
}

.change-box-content, .popup-content {
    background: var(--modal-bg);
    padding: 28px 24px;
    border-radius: var(--radius);
    width: 90%;
    max-width: 350px;
    border: 1px solid var(--glass-border);
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    animation: pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes pop {
    from { transform: scale(0.92); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.change-box-content h3 {
    margin-bottom: 18px;
    color: var(--text-light);
    font-size: 18px;
}

.change-box-content input {
    margin-bottom: 12px;
}

.cancel-link {
    display: inline-block;
    margin-top: 14px;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
}

.cancel-link:hover {
    color: var(--text-light);
}

.footer-blue {
    width: 100%;
    position: relative;
    height: 30px;
    z-index: 2;
}

.footer-wave {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    line-height: 0;
}

.footer-wave svg {
    display: block;
    width: 100%;
    height: 30px;
}
</style>
</head>

<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="top">
    <div class="illustration"></div>
    <div class="brand-badge">₹</div>
    <h1>ಕಾರ್ಯ ಮತ್ತು ಪಾಲನಾ ವಿಭಾಗ<br>ಹೆಸ್ಕಾಂ, ಶಿರಸಿ</h1>
</div>

<div class="bottom">
    <div class="login-box">
        <div id="error"></div>

        <div class="input-group">
            <i data-lucide="user" class="input-icon"></i>
            <input type="text" id="username" placeholder="ಬಳಕೆದಾರರ ಹೆಸರು (Username)">
        </div>

        <div class="input-group">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="password" placeholder="ಪಾಸ್‌ವರ್ಡ್ (Password)">
            <span class="toggle-password" onclick="togglePassword()">
                <i data-lucide="eye" id="eyeIcon" style="width: 18px; height: 18px;"></i>
            </span>
        </div>

        <button onclick="login()">
            <span>ಲಾಗಿನ್ (Login)</span>
            <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
        </button>
        <button class="change-btn" onclick="openChangePassword()">
            <i data-lucide="key-round" style="width: 16px; height: 16px;"></i>
            <span>ಪಾಸ್‌ವರ್ಡ್ ಬದಲಾಯಿಸಿ</span>
        </button>
    </div>

    <div class="features">
        <div class="f">
            <div class="i-box"><i data-lucide="shield-check" style="width: 20px; height: 20px;"></i></div>
            <b>Secure</b>
            <span>ಸುರಕ್ಷತೆ</span>
        </div>
        <div class="f">
            <div class="i-box"><i data-lucide="handshake" style="width: 20px; height: 20px;"></i></div>
            <b>Reliable</b>
            <span>ವಿಶ್ವಾಸಾರ್ಹ</span>
        </div>
        <div class="f">
            <div class="i-box"><i data-lucide="zap" style="width: 20px; height: 20px;"></i></div>
            <b>Efficient</b>
            <span>ದಕ್ಷತೆ</span>
        </div>
        <div class="f">
            <div class="i-box"><i data-lucide="users" style="width: 20px; height: 20px;"></i></div>
            <b>Employee</b>
            <span>ಸಿಬ್ಬಂದಿ ಪ್ರಥಮ</span>
        </div>
    </div>
</div>

<div id="loader">
    <div class="morph-spinner">
        <i data-lucide="zap" style="color: var(--accent-cyan); width: 28px; height: 28px;"></i>
    </div>
    <div class="loader-text">Securing Session...</div>
</div>

<div id="cpLoader">
    <div class="morph-spinner"></div>
</div>

<div id="changeBox">
    <div class="change-box-content">
        <h3>ಪಾಸ್‌ವರ್ಡ್ ಬದಲಾಯಿಸಿ</h3>
        <div class="input-group">
            <i data-lucide="user" class="input-icon"></i>
            <input id="cp_user" placeholder="Username">
        </div>
        <div class="input-group">
            <i data-lucide="lock" class="input-icon"></i>
            <input id="old_pass" type="password" placeholder="ಹಳೆಯ ಪಾಸ್‌ವರ್ಡ್">
        </div>
        <div class="input-group">
            <i data-lucide="key" class="input-icon"></i>
            <input id="new_pass" type="password" placeholder="ಹೊಸ ಪಾಸ್‌ವರ್ಡ್">
        </div>

        <button onclick="changePassword()">ಉಳಿಸಿ (Save)</button>
        <span class="cancel-link" onclick="closeBox()">ರದ್ದುಗೊಳಿಸಿ (Cancel)</span>
    </div>
</div>

<div id="successPopup">
    <div class="popup-content">
        <i data-lucide="check-circle-2" style="width: 48px; height: 48px; color: var(--success); margin-bottom: 12px;"></i>
        <h3 style="margin-bottom: 6px;">ಯಶಸ್ವಿಯಾಗಿದೆ</h3>
        <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 13px;">ಪಾಸ್‌ವರ್ಡ್ ಯಶಸ್ವಿಯಾಗಿ ಬದಲಾಗಿದೆ</p>
        <button onclick="closeSuccess()">ಸರಿ (OK)</button>
    </div>
</div>

<div id="errorPopup">
    <div class="popup-content">
        <i data-lucide="x-circle" style="width: 48px; height: 48px; color: var(--error); margin-bottom: 12px;"></i>
        <h3 style="margin-bottom: 6px; color: var(--error);">ವಿಫಲವಾಗಿದೆ</h3>
        <p id="errorText" style="color: var(--text-muted); margin-bottom: 20px; font-size: 13px;">ವಿವರಗಳು ತಪ್ಪು</p>
        <button onclick="closeError()" style="background: var(--error);">ಸರಿ (OK)</button>
    </div>
</div>

<div class="footer-blue">
    <div class="footer-wave">
        <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="rgba(139, 92, 246, 0.08)" d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,144C672,139,768,181,864,202.7C960,224,1056,224,1152,197.3C1248,171,1344,117,1392,90.7L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        </svg>
    </div>
</div>

<script>
lucide.createIcons();

function showLoader(text = "Securing Session..."){
    const loader = document.getElementById("loader");
    const txt = document.querySelector(".loader-text");
    loader.style.display = "flex";
    loader.style.opacity = "1";
    txt.innerText = text;
}

function hideLoader(){
    const loader = document.getElementById("loader");
    loader.style.opacity = "0";
    setTimeout(()=>{ loader.style.display = "none"; }, 400);
}

function login(){
    let user = document.getElementById("username").value.trim();
    let pass = document.getElementById("password").value.trim();

    if(user === "" || pass === ""){
        document.getElementById("errorText").innerText="ಬಳಕೆದಾರರ ಹೆಸರು ಅಥವಾ ಪಾಸ್‌ವರ್ಡ್ ನಮೂದಿಸಿ";
        document.getElementById("errorPopup").style.display="flex";
        return;
    }
    let deviceId = localStorage.getItem("deviceId");

    if(!deviceId){
        deviceId = "DEV-" + Date.now() + "-" + Math.floor(Math.random()*10000);
        localStorage.setItem("deviceId", deviceId);
    }

    showLoader("ಪರಿಶೀಲಿಸಲಾಗುತ್ತಿದೆ...");

    let url = "https://script.google.com/macros/s/AKfycbzeO5RppL-lE_62OuL4VQ5FYZiehPMPFsH6NC9X2_i40YEIzXPPjW8-QUH1QpfS1Jg1/exec"
      + "?username=" + encodeURIComponent(user)
      + "&password=" + encodeURIComponent(pass)
      + "&deviceId=" + deviceId;

    fetch(url)
    .then(res => res.text())
    .then(text => {
        let data;
        try{ data = JSON.parse(text); } catch(e){ data = {status:"fail"}; }

        if(data.status === "success"){
            localStorage.setItem("currentUser", user);
            localStorage.setItem("role", data.role);
            document.querySelector(".loader-text").innerText = "ಲಾಗಿನ್ ಯಶಸ್ವಿಯಾಗಿದೆ...";
            setTimeout(function(){ window.location = "home.html"; }, 1000); 
        }else{
            hideLoader();
            document.getElementById("error").innerText="ತಪ್ಪಾದ ಬಳಕೆದಾರರ ಹೆಸರು ಅಥವಾ ಪಾಸ್‌ವರ್ಡ್";
        }
    })
    .catch(err => {
        hideLoader();
        document.getElementById("error").innerText="ಸರ್ವರ್ ದೋಷ ಸಂಭವಿಸಿದೆ";
    });
}

function togglePassword(){
    let passField = document.getElementById("password");
    let eyeIcon = document.getElementById("eyeIcon");
    if (passField.type === "password") {
        passField.type = "text";
        eyeIcon.setAttribute("data-lucide", "eye-off");
    } else {
        passField.type = "password";
        eyeIcon.setAttribute("data-lucide", "eye");
    }
    lucide.createIcons();
}

function openChangePassword(){
    document.getElementById("changeBox").style.display="flex";
    document.getElementById("cp_user").value = document.getElementById("username").value;
}

function closeBox(){
    document.getElementById("changeBox").style.display="none";
}

function changePassword(){
    let user = document.getElementById("cp_user").value.trim();
    let oldPass = document.getElementById("old_pass").value.trim();
    let newPass = document.getElementById("new_pass").value.trim();

    if(user == "" || oldPass == "" || newPass == ""){
        document.getElementById("errorText").innerText = "ದಯವಿಟ್ಟು ಎಲ್ಲಾ ವಿವರಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ.";
        document.getElementById("errorPopup").style.display = "flex";
        return;
    }

    document.getElementById("cpLoader").style.display = "flex";

    let formData = new URLSearchParams();
    formData.append("username", user);
    formData.append("oldPassword", oldPass);
    formData.append("newPassword", newPass);

    fetch("https://script.google.com/macros/s/AKfycbzeO5RppL-lE_62OuL4VQ5FYZiehPMPFsH6NC9X2_i40YEIzXPPjW8-QUH1QpfS1Jg1/exec", {
        method:"POST",
        body: formData
    })
    .then(res => res.text())
    .then(text => {
        document.getElementById("cpLoader").style.display = "none";
        let data;
        try { data = JSON.parse(text); } catch(e) { data = {status:"fail"}; }

        if(data.status === "updated"){
            document.getElementById("changeBox").style.display = "none";
            document.getElementById("successPopup").style.display = "flex";
        } else {
            document.getElementById("errorText").innerText = "ತಪ್ಪಾದ ಬಳಕೆದಾರರ ಹೆಸರು ಅಥವಾ ಹಳೆಯ ಪಾಸ್‌ವರ್ಡ್";
            document.getElementById("errorPopup").style.display = "flex";
        }
    })
    .catch(err => {
        document.getElementById("cpLoader").style.display = "none";
        document.getElementById("errorText").innerText = "ಸರ್ವರ್ ದೋಷ. ದಯವಿಟ್ಟು ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.";
        document.getElementById("errorPopup").style.display = "flex";
    });
}

function closeSuccess(){
    document.getElementById("successPopup").style.display="none";
    closeBox();
}

function closeError(){
    document.getElementById("errorPopup").style.display="none";
}

window.addEventListener("load", function(){
    setTimeout(() => { hideLoader(); }, 400);
});
</script>
</body>
</html>
