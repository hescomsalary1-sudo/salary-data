<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Consumer Search - HESCOM Siddapur</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Noto Sans Kannada', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
}

body {
  background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #072a42 60%, #020617 100%);
  min-height: 100vh;
  color: #f8fafc;
  padding-bottom: 95px; /* Space for fixed app footer */
  position: relative;
}

/* Ambient Background Light Orbs */
.bg-glow-1 {
  position: absolute;
  top: -60px;
  right: -40px;
  width: 280px;
  height: 280px;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(0,0,0,0) 70%);
  pointer-events: none;
  z-index: 0;
}

.bg-glow-2 {
  position: absolute;
  top: 40%;
  left: -100px;
  width: 320px;
  height: 320px;
  background: radial-gradient(circle, rgba(14, 165, 233, 0.25) 0%, rgba(0,0,0,0) 70%);
  pointer-events: none;
  z-index: 0;
}

/* Redesigned Modern Header Bar */
.modern-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(7, 42, 66, 0.75);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  padding: 14px 18px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.user-profile-badge {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar-circle {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, #38bdf8, #4f46e5);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.3);
  flex-shrink: 0;
}

.user-info .header-title {
  font-size: 0.98rem;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: 0.2px;
  line-height: 1.2;
}

.user-info .sub-tag {
  font-size: 0.72rem;
  color: #38bdf8;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 2px;
}

.status-dot {
  width: 7px;
  height: 7px;
  background-color: #22c55e;
  border-radius: 50%;
  box-shadow: 0 0 8px #22c55e;
}

.header-actions {
  display: flex;
  gap: 8px;
}

.btn-icon-nav {
  background: rgba(255, 255, 255, 0.08);
  color: #e2e8f0;
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.78rem;
  font-weight: 600;
  transition: all 0.2s ease;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-icon-nav:active {
  transform: scale(0.95);
  background: rgba(255, 255, 255, 0.18);
}

.btn-header-logout {
  background: rgba(239, 68, 68, 0.15);
  color: #fca5a5;
  border-color: rgba(239, 68, 68, 0.3);
}

.btn-header-logout:active {
  background: rgba(239, 68, 68, 0.3);
}

/* Container */
.container {
  width: 100%;
  max-width: 520px;
  margin: 18px auto 0 auto;
  padding: 0 16px;
  position: relative;
  z-index: 10;
}

/* Hero Search Card */
.hero-search-card {
  background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(7, 42, 66, 0.75));
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 20px;
  padding: 20px 18px;
  box-shadow: 0 14px 35px rgba(0, 0, 0, 0.45);
  margin-bottom: 22px;
  animation: fadeInDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.search-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: #f8fafc;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.search-subtitle {
  font-size: 0.76rem;
  color: #94a3b8;
  margin-bottom: 14px;
}

.search-field-box {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.input-container {
  position: relative;
  width: 100%;
}

.input-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.1rem;
  opacity: 0.7;
  pointer-events: none;
}

.search-input {
  width: 100%;
  padding: 13px 14px 13px 44px;
  font-size: 0.92rem;
  font-weight: 500;
  color: #ffffff;
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid rgba(56, 189, 248, 0.3);
  border-radius: 12px;
  outline: none;
  transition: all 0.25s ease;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
}

.search-input:focus {
  border-color: #38bdf8;
  background: rgba(15, 23, 42, 0.95);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25), inset 0 2px 4px rgba(0, 0, 0, 0.2);
}

.search-input::placeholder {
  color: #64748b;
  font-size: 0.84rem;
}

.btn-primary-search {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 8px 20px rgba(2, 132, 199, 0.4);
  transition: all 0.2s ease;
}

.btn-primary-search:hover {
  box-shadow: 0 10px 25px rgba(56, 189, 248, 0.5);
}

.btn-primary-search:active {
  transform: scale(0.98);
}

/* Quick Filter Pills */
.filter-pills {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  overflow-x: auto;
  padding-bottom: 2px;
}

.pill-tag {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.68rem;
  color: #cbd5e1;
  white-space: nowrap;
}

/* Data Container & Consumer Cards */
.data-container {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.consumer-card {
  background: rgba(15, 23, 42, 0.78);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid rgba(56, 189, 248, 0.25);
  box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
  animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.card-header {
  background: linear-gradient(135deg, rgba(79, 70, 229, 0.35), rgba(2, 132, 199, 0.25));
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-header-title {
  font-size: 0.98rem;
  font-weight: 700;
  color: #38bdf8;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-body {
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.detail-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 8px 0;
  border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
  font-size: 0.84rem;
  gap: 12px;
}

.detail-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.detail-label {
  color: #94a3b8;
  font-weight: 500;
  flex: 1;
}

.detail-value {
  color: #f8fafc;
  font-weight: 600;
  text-align: right;
  flex: 1.2;
  word-break: break-word;
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: #94a3b8;
  background: rgba(15, 23, 42, 0.55);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 18px;
  border: 1px dashed rgba(255, 255, 255, 0.15);
  font-size: 0.86rem;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}

.empty-state-icon {
  font-size: 2.2rem;
  margin-bottom: 10px;
  opacity: 0.85;
}

/* Loader Component */
#page-loader {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 75px;
  background: rgba(2, 6, 23, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 1100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.spinner-container {
  position: relative;
  width: 44px;
  height: 44px;
  margin-bottom: 12px;
}

.spinner-outer {
  width: 100%;
  height: 100%;
  border: 3px solid rgba(56, 189, 248, 0.2);
  border-top-color: #38bdf8;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.spinner-inner {
  position: absolute;
  top: 6px;
  left: 6px;
  width: 26px;
  height: 26px;
  border: 3px solid rgba(255, 255, 255, 0.1);
  border-bottom-color: #818cf8;
  border-radius: 50%;
  animation: spin-reverse 0.5s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes spin-reverse {
  0% { transform: rotate(360deg); }
  100% { transform: rotate(0deg); }
}

.loader-text {
  font-size: 0.85rem;
  font-weight: 600;
  color: #38bdf8;
}

/* FLOATING FOOTER NAVBAR */
.app-footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 75px;
  background: #072a42;
  border-top-left-radius: 30px;
  border-top-right-radius: 30px;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.45);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 1200;
}

.nav-item {
  flex: 1;
  text-align: center;
  cursor: pointer;
  position: relative;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.nav-icon {
  font-size: 20px;
  color: #94a3b8;
  transition: all 0.25s ease;
}

.nav-item span {
  display: block;
  font-size: 11px;
  color: #94a3b8;
  margin-top: 2px;
  transition: all 0.25s ease;
}

.nav-item.active::before {
  content: "";
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 26px;
  height: 3px;
  border-radius: 10px;
  background: #38bdf8;
  box-shadow: 0 0 8px #38bdf8;
}

.nav-item.active .nav-icon,
.nav-item.active span {
  color: #38bdf8;
  font-weight: 600;
}

.center-item {
  display: flex;
  justify-content: center;
  align-items: center;
}

.center-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  transform: translateY(-18px);
}

.center-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1d4ed8, #0284c7);
  color: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 26px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), 0 0 12px rgba(56, 189, 248, 0.4);
  border: 3px solid #072a42;
  animation: float 2s ease-in-out infinite;
}

.center-text {
  font-size: 11px;
  margin-top: 4px;
  color: #38bdf8;
  font-weight: 600;
}

.nav-item:active {
  transform: scale(0.92);
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<!-- Loader Overlay -->
<div id="page-loader">
  <div class="spinner-container">
    <div class="spinner-outer"></div>
    <div class="spinner-inner"></div>
  </div>
  <div class="loader-text" id="loaderText">Loading data...</div>
</div>

<!-- Modern Redesigned Header Bar -->
<div class="modern-header">
  <div class="header-top">
    <div class="user-profile-badge">
      <div class="avatar-circle">⚡</div>
      <div class="user-info">
        <div class="header-title" id="lmNameDisplay">--</div>
        <div class="sub-tag">
          <span class="status-dot"></span>
          <span>HESCOM Siddapur</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-icon-nav btn-header-logout" onclick="logout()">
        <span>Logout</span>
      </button>
    </div>
  </div>
</div>

<div class="container">

  <!-- Hero Search Card -->
  <div class="hero-search-card">
    <div class="search-title">
      <span>🔍</span>
      <span>ಗ್ರಾಹಕರ ಶೋಧನೆ (Consumer Search)</span>
    </div>
    <div class="search-subtitle">
      Instant search across all records by RR Number, Mobile, or Name.
    </div>

    <div class="search-field-box">
      <div class="input-container">
        <span class="input-icon">⚡</span>
        <input type="text" id="queryInput" class="search-input" placeholder="Type RR No, Mobile, or Consumer Name...">
      </div>
      <button class="btn-primary-search" onclick="performDirectSearch()">
        <span>Search Consumer</span>
      </button>
    </div>

    <div class="filter-pills">
      <span class="pill-tag">💡 Tip: RR No</span>
      <span class="pill-tag">📱 Mobile Number</span>
      <span class="pill-tag">👤 Name</span>
    </div>
  </div>

  <!-- Cards Container -->
  <div id="dataContainer" class="data-container">
    <div class="empty-state">
      <div class="empty-state-icon">📋</div>
      <div>Enter a query above to view consumer details.</div>
    </div>
  </div>

</div>

<!-- APP FOOTER NAVBAR -->
<div class="app-footer" id="navbar">
  <div class="nav-item" onclick="goTab('menu2.html')">
    <div class="nav-icon">🏠</div>
    <span>Home</span>
  </div>

  <div class="nav-item" onclick="goTab('foot1.html')">
    <div class="nav-icon">💬</div>
    <span>Forum</span>
  </div>

  <div class="nav-item center-item" onclick="goTab('foot2.html')">
    <div class="center-wrapper">
      <div class="center-btn">⚡</div>
      <div class="center-text">Quick search</div>
    </div>
  </div>

  <div class="nav-item" onclick="goTab('foot3.html')">
    <div class="nav-icon">👤</div>
    <span>MR</span>
  </div>

  <div class="nav-item" onclick="goTab('foot4.html')">
    <div class="nav-icon">📂</div>
    <span>Resources</span>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyCP_ACzGUE1JBL5UDgRMK0tbHvq489GpnNgQ-7HVzM3dTkc0cFG7j5kY9QqOJLMNbpXg/exec";

const lmName = sessionStorage.getItem("lmName");

if (!lmName) { 
  alert("Session expired. Please log in again."); 
  location.href = "login2.html"; 
}

document.getElementById("lmNameDisplay").textContent = lmName;

const queryInput = document.getElementById("queryInput");
const dataContainer = document.getElementById("dataContainer");
const pageLoader = document.getElementById("page-loader");
const loaderText = document.getElementById("loaderText");

function showLoader(msg = "Loading...") {
  loaderText.textContent = msg;
  pageLoader.style.display = "flex";
}

function hideLoader() {
  pageLoader.style.display = "none";
}

// Global Search trigger on Enter key press
queryInput.addEventListener("keypress", function (e) {
  if (e.key === "Enter") performDirectSearch();
});

function performDirectSearch() {
  const query = queryInput.value.trim();
  if (!query) {
    alert("Please enter an RR No, Mobile Number, or Name to search.");
    return;
  }
  fetchByQuery(query);
}

function fetchByQuery(query) {
  showLoader("Fetching consumer details...");

  fetch(`${API_URL}?action=consumer&query=${encodeURIComponent(query)}&rrno=${encodeURIComponent(query)}`)
    .then(res => res.json())
    .then(data => {
      hideLoader();

      if (data.status !== "success") {
        alert("Error: " + (data.message || "No records found."));
        return;
      }

      if (Array.isArray(data.consumer)) {
        renderMultipleConsumers(data.consumer);
      } else if (data.consumer) {
        renderConsumerCard(data.consumer);
      } else {
        alert("No details found matching your query.");
      }
    })
    .catch(err => {
      hideLoader();
      console.error(err);
      alert("Error retrieving details. Please try again.");
    });
}

function renderMultipleConsumers(list) {
  dataContainer.innerHTML = "";
  if (list.length === 0) {
    dataContainer.innerHTML = `<div class="empty-state">No matching consumers found.</div>`;
    return;
  }
  list.forEach(item => renderConsumerCard(item, false));
}

function renderConsumerCard(consumerObj, clearContainer = true) {
  if (clearContainer) dataContainer.innerHTML = "";

  const card = document.createElement("div");
  card.className = "consumer-card";

  const rrVal = consumerObj["RR No"] || consumerObj["RRNO"] || consumerObj["rrno"] || "Consumer Information";

  const excludedKeysLower = [
    "column_5", "area name", "rd", "sl", "cb(repeated)", 
    "tc", "tc(repeated)", "pole name", "lm name", "sino", 
    "slno", "si no", "sl no", "rr no", "rrno", "rr number"
  ];

  let rowsHtml = "";
  Object.keys(consumerObj).forEach(key => {
    const cleanKey = key.trim().toLowerCase();
    if (excludedKeysLower.includes(cleanKey)) return;

    let val = consumerObj[key];
    if (val === null || val === undefined || val === "") val = "-";

    rowsHtml += `
      <div class="detail-row">
        <span class="detail-label">${key}</span>
        <span class="detail-value">${val}</span>
      </div>
    `;
  });

  card.innerHTML = `
    <div class="card-header">
      <div class="card-header-title">
        <span>📄</span>
        <span>RR No: ${rrVal}</span>
      </div>
    </div>
    <div class="card-body">
      ${rowsHtml}
    </div>
  `;

  dataContainer.appendChild(card);
}

function goTab(url) {
  sessionStorage.setItem("navClick", "true");
  showLoader("Loading...");
  setTimeout(() => {
    window.location.replace(url);
  }, 300);
}

window.addEventListener("load", () => {
  const currentPage = location.pathname.split("/").pop() || "foot1.html";
  const navItems = document.querySelectorAll(".nav-item");

  navItems.forEach(item => {
    const onclickAttr = item.getAttribute("onclick");
    if (onclickAttr && onclickAttr.includes(currentPage)) {
      item.classList.add("active");
    }
  });
});

function logout() {
  showLoader("Logging out...");
  setTimeout(() => {
    sessionStorage.clear();
    location.href = "login2.html";
  }, 250);
}

history.pushState(null, null, location.href);
window.onpopstate = function () {
  window.location.replace("menu2.html");
};
</script>
</body>
</html>
