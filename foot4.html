<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Footer Navigation - HESCOM</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Noto Sans Kannada', 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #072a42 60%, #020617 100%);
      min-height: 100vh;
      color: #f8fafc;
      padding-bottom: 90px; /* Essential space so content isn't covered by the fixed footer */
      position: relative;
    }

    /* Page Content Styling */
    .page-content {
      padding: 24px 16px;
      text-align: center;
      max-width: 500px;
      margin: 0 auto;
    }

    .demo-card {
      background: rgba(7, 42, 66, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 24px;
      margin-top: 40px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .demo-card h1 {
      font-size: 1.25rem;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .demo-card p {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.5;
    }

    /* ========================================================
       FLOATING FOOTER NAVBAR (#072A42)
       ======================================================== */
    .app-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 75px;
      background: #072a42;
      border-top-left-radius: 30px;
      border-top-right-radius: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.45);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .nav-item {
      flex: 1;
      text-align: center;
      cursor: pointer;
      position: relative;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .nav-icon {
      font-size: 20px;
      color: #94a3b8;
      transition: all 0.25s ease;
    }

    .nav-item span {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
      transition: all 0.25s ease;
    }

    /* Active Indicator Pill (Top Line Glow) */
    .nav-item.active::before {
      content: "";
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 26px;
      height: 3px;
      border-radius: 10px;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    .nav-item.active .nav-icon,
    .nav-item.active span {
      color: #38bdf8;
      font-weight: 600;
    }

    /* Center Button Styling */
    .center-item {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .center-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-18px);
    }

    .center-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1d4ed8, #0284c7);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), 0 0 12px rgba(56, 189, 248, 0.4);
      border: 3px solid #072a42;
      animation: float 2s ease-in-out infinite;
    }

    .center-text {
      font-size: 11px;
      margin-top: 4px;
      color: #38bdf8;
      font-weight: 600;
    }

    /* Click Effect */
    .nav-item:active {
      transform: scale(0.92);
    }

    /* Float Keyframe Animation */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Fullscreen Loader Component */
    #page-loader {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 1100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .spinner-container {
      position: relative;
      width: 42px;
      height: 42px;
      margin-bottom: 12px;
    }

    .spinner-outer {
      width: 100%;
      height: 100%;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loader-text {
      font-size: 0.85rem;
      color: #38bdf8;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Demo Body Content -->
  <div class="page-content">
    <div class="demo-card">
      <h1>HESCOM App Page</h1>
      <p>This is a full HTML page demo with the floating footer navigation bar fixed at the bottom.</p>
    </div>
  </div>

  <!-- APP FOOTER NAVBAR -->
  <div class="app-footer" id="navbar">
    <div class="nav-item" onclick="goTab('foot1.html')">
      <div class="nav-icon">🏠</div>
      <span>Home</span>
    </div>

    <div class="nav-item" onclick="goTab('foot2.html')">
      <div class="nav-icon">💬</div>
      <span>Forum</span>
    </div>

    <div class="nav-item center-item" onclick="goTab('menu2.html')">
      <div class="center-wrapper">
        <div class="center-btn">⚡</div>
        <div class="center-text">Smart Support</div>
      </div>
    </div>

    <div class="nav-item" onclick="goTab('foot3.html')">
      <div class="nav-icon">👤</div>
      <span>Employee</span>
    </div>

    <div class="nav-item" onclick="goTab('foot4.html')">
      <div class="nav-icon">📂</div>
      <span>Resources</span>
    </div>
  </div>

  <!-- Optional Navigation Loader -->
  <div id="page-loader">
    <div class="spinner-container">
      <div class="spinner-outer"></div>
    </div>
    <div class="loader-text" id="loaderText">Loading...</div>
  </div>

  <script>
    // Tab Navigation Handler
    function goTab(url) {
      sessionStorage.setItem("navClick", "true");
      const loader = document.getElementById("page-loader");
      const loaderText = document.getElementById("loaderText");

      if (loader && loaderText) {
        loader.style.display = "flex";
        loaderText.textContent = "Loading...";
      }

      setTimeout(() => {
        window.location.replace(url);
      }, 400);
    }

    // Highlight Active Tab Based on Page Name
    window.addEventListener("load", () => {
      const currentPage = location.pathname.split("/").pop() || "menu2.html";
      const navItems = document.querySelectorAll(".nav-item");

      navItems.forEach(item => {
        const onclickAttr = item.getAttribute("onclick");
        if (onclickAttr && onclickAttr.includes(currentPage)) {
          item.classList.add("active");
        }
      });
    });

      history.pushState(null, null, location.href);

window.onpopstate = function () {
  window.location.replace("menu2.html");
};
  </script>

</body>
</html>
