<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LM Login - HESCOM Siddapur</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Noto Sans Kannada', 'Plus Jakarta Sans', sans-serif;
}

body {
  /* Rich Dark Blue Multi-Stop Gradient */
  background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 40%, #020617 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  position: relative;
  overflow: hidden;
}

/* Glowing background ambient lights */
body::before, body::after {
  content: '';
  position: absolute;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.35;
  pointer-events: none;
}
body::before {
  background: #3b82f6;
  top: 15%;
  left: 20%;
}
body::after {
  background: #1d4ed8;
  bottom: 15%;
  right: 20%;
}

.login-card {
  position: relative;
  width: 100%;
  max-width: 410px;
  /* Glassmorphic dark overlay */
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 40px 30px;
  border-radius: 24px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
              0 0 30px rgba(59, 130, 246, 0.15);
  text-align: center;
  z-index: 10;
}

/* Header Icon */
.header-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #ffffff;
  border-radius: 16px;
  font-size: 28px;
  margin-bottom: 20px;
  box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.2);
}

/* Kannada Header */
.kannada-header {
  font-size: 1.1rem;
  font-weight: 700;
  color: #f8fafc;
  line-height: 1.6;
  margin-bottom: 8px;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
}

.sub-header {
  font-size: 0.85rem;
  font-weight: 600;
  color: #60a5fa;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 24px;
}

.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
  margin-bottom: 28px;
}

/* Input Styling */
.input-group {
  position: relative;
  margin-bottom: 22px;
}

input {
  width: 100%;
  padding: 16px 18px;
  font-size: 16px;
  color: #f8fafc;
  background: rgba(30, 41, 59, 0.7);
  border: 1.5px solid rgba(255, 255, 255, 0.12);
  border-radius: 14px;
  outline: none;
  transition: all 0.3s ease;
  text-align: center;
  letter-spacing: 3px;
}

input::placeholder {
  color: #64748b;
  letter-spacing: normal;
}

input:focus {
  border-color: #3b82f6;
  background: rgba(30, 41, 59, 0.95);
  box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25),
              0 0 15px rgba(59, 130, 246, 0.2);
}

/* Primary Button */
button {
  width: 100%;
  padding: 16px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.5px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #ffffff;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
  transition: all 0.3s ease;
}

button:hover {
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  transform: translateY(-2px);
  box-shadow: 0 14px 28px rgba(37, 99, 235, 0.45);
}

button:active {
  transform: translateY(0);
}

/* Ultra Modern Dual-Ring Loader */
#loader {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-top: 22px;
}

.spinner-container {
  position: relative;
  width: 42px;
  height: 42px;
  margin-bottom: 10px;
}

.spinner-outer {
  width: 100%;
  height: 100%;
  border: 3px solid rgba(59, 130, 246, 0.2);
  border-top-color: #60a5fa;
  border-radius: 50%;
  animation: spin 0.9s cubic-bezier(0.53, 0.21, 0.29, 0.67) infinite;
}

.spinner-inner {
  position: absolute;
  top: 6px;
  left: 6px;
  width: 24px;
  height: 24px;
  border: 3px solid rgba(255, 255, 255, 0.1);
  border-bottom-color: #93c5fd;
  border-radius: 50%;
  animation: spin-reverse 0.6s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes spin-reverse {
  0% { transform: rotate(360deg); }
  100% { transform: rotate(0deg); }
}

.loader-text {
  font-size: 0.85rem;
  color: #93c5fd;
  font-weight: 500;
  letter-spacing: 0.5px;
}

/* Error Message */
#error {
  margin-top: 18px;
  color: #f87171;
  font-size: 0.9rem;
  font-weight: 600;
  min-height: 20px;
}

/* Footer */
.footer {
  margin-top: 28px;
  font-size: 12px;
  color: #64748b;
  font-weight: 500;
}
</style>
</head>
<body>

<div class="login-card">
  <div class="header-badge">⚡</div>
  
  <!-- Kannada Header -->
  <div class="kannada-header">
    ಕಾರ್ಯ ಮತ್ತು ಪಾಲನಾ ಶಾಖೆ<br>
    ಸಿದ್ದಾಪುರ ಪಟ್ಟಣ, ಹೆಸ್ಕಾಂ, ಸಿದ್ದಾಪುರ
  </div>
  
  <div class="sub-header">LM Login</div>

  <div class="divider"></div>

  <div class="input-group">
    <input type="password" id="mpin" placeholder="Enter M_PIN" maxlength="10" autocomplete="off">
  </div>
  
  <button onclick="login()">LOGIN</button>
  
  <!-- Ultra Modern Dual-Ring Loader -->
  <div id="loader">
    <div class="spinner-container">
      <div class="spinner-outer"></div>
      <div class="spinner-inner"></div>
    </div>
    <div class="loader-text">Authenticating...</div>
  </div>
  
  <div id="error"></div>
  
  <div class="footer">Powered by Google Sheets</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxzt8aQteGxi3fB6xR9o3Ca8PcBstiE5z8bsAekwOo5UP7_d9j12n956TGxWX0bC3d70A/exec";

function login() {
  let mpin = document.getElementById("mpin").value.trim();

  if (mpin === "") {
    document.getElementById("error").innerHTML = "Enter M_PIN";
    return;
  }

  document.getElementById("loader").style.display = "flex";
  document.getElementById("error").innerHTML = "";

  fetch(API_URL + "?action=login&mpin=" + encodeURIComponent(mpin))
    .then(res => res.json())
    .then(data => {
      document.getElementById("loader").style.display = "none";
      if (data.status === "success") {
        sessionStorage.setItem("mpin", mpin);
        sessionStorage.setItem("lmName", data.lmName);
        sessionStorage.setItem("tcList", JSON.stringify(data.tcList));
        window.location.href = "menu2.html";
      } else {
        document.getElementById("error").innerHTML = data.message;
      }
    })
    .catch(err => {
      document.getElementById("loader").style.display = "none";
      document.getElementById("error").innerHTML = "Unable to connect.";
      console.error(err);
    });
}

document.getElementById("mpin").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    login();
  }
});



  // Place inside your successful login block in login2.html
async function prefetchUserData(mpin, rawTcList) {
  try {
    const API_URL = "https://script.google.com/macros/s/AKfycbxzt8aQteGxi3fB6xR9o3Ca8PcBstiE5z8bsAekwOo5UP7_d9j12n956TGxWX0bC3d70A/exec";
    
    // 1. Fetch user TCs if not provided
    let tcs = rawTcList;
    if (!tcs || tcs.length === 0) {
      const tcRes = await fetch(`${API_URL}?action=getTCs&mpin=${encodeURIComponent(mpin)}`);
      const tcData = await tcRes.json();
      if (tcData.status === "success") {
        tcs = tcData.tcList;
        sessionStorage.setItem("tcList", JSON.stringify(tcs));
      }
    }

    if (!tcs || tcs.length === 0) return;

    // 2. Fetch all RR List entries for user TCs
    const tcPromises = tcs.map(tc =>
      fetch(`${API_URL}?action=rr&tc=${encodeURIComponent(tc)}`)
        .then(res => res.json())
        .then(data => ({ tc, data }))
        .catch(() => ({ tc, data: null }))
    );

    const tcResults = await Promise.all(tcPromises);
    let allRRItems = [];
    tcResults.forEach(item => {
      if (item.data && item.data.status === "success" && item.data.rrList) {
        item.data.rrList.forEach(r => {
          allRRItems.push({ tc: item.tc, rrno: r.rrno });
        });
      }
    });

    // 3. Parallel fetch consumer details and filter CB > 500
    const consumerPromises = allRRItems.map(item =>
      fetch(`${API_URL}?action=consumer&rrno=${encodeURIComponent(item.rrno)}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.status === "success" && data.consumer) {
            const c = data.consumer;
            const cbRaw = c["CB"] || c["Closing Balance"] || c["CB Amount"] || c["BALANCE"] || "0";
            const cbVal = parseFloat(String(cbRaw).replace(/,/g, '').trim()) || 0;

            if (cbVal > 500) {
              return {
                tc: item.tc,
                rrno: c["RR No"] || c["RRNO"] || item.rrno,
                name: c["Name"] || c["Consumer Name"] || c["NAME"] || "N/A",
                cb: cbVal,
                fullData: c
              };
            }
          }
          return null;
        })
        .catch(() => null)
    );

    const over500List = (await Promise.all(consumerPromises)).filter(Boolean);

    // Save preloaded data into sessionStorage
    sessionStorage.setItem("cachedArrearsData", JSON.stringify(over500List));
    sessionStorage.setItem("arrearsLoaded", "true");
  } catch (err) {
    console.error("Background prefetch failed:", err);
  }
}

// Example usage on Login Success:
function onLoginSuccess(loginResponse) {
  sessionStorage.setItem("lmName", loginResponse.lmName);
  sessionStorage.setItem("mpin", userMpin);
  sessionStorage.setItem("tcList", JSON.stringify(loginResponse.tcList || []));
  
  // Start prefetching in background (fire & forget)
  prefetchUserData(userMpin, loginResponse.tcList);

  // Navigate immediately
  location.href = "menu2.html";
}
</script>

</body>
</html>
