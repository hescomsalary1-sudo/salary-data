<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LM Login</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}
body {
  background: linear-gradient(135deg, #1565C0, #42A5F5);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.login-box {
  width: 350px;
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
}
h2 {
  text-align: center;
  margin-bottom: 25px;
  color: #1565C0;
}
input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 6px;
  margin-bottom: 20px;
  outline: none;
}
input:focus {
  border-color: #1565C0;
}
button {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  background: #1565C0;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
button:hover {
  background: #0D47A1;
}
#loader {
  display: none;
  text-align: center;
  margin-top: 15px;
  color: #1565C0;
}
#error {
  margin-top: 15px;
  color: red;
  text-align: center;
  font-weight: bold;
}
.footer {
  margin-top: 20px;
  text-align: center;
  font-size: 13px;
  color: #666;
}
</style>
</head>
<body>

<div class="login-box">
  <h2>LM LOGIN</h2>
  <input type="password" id="mpin" placeholder="Enter M_PIN">
  <button onclick="login()">LOGIN</button>
  <div id="loader">Please wait...</div>
  <div id="error"></div>
  <div class="footer">Powered by Google Sheets</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxzt8aQteGxi3fB6xR9o3Ca8PcBstiE5z8bsAekwOo5UP7_d9j12n956TGxWX0bC3d70A/exec";

function login() {
  let mpin = document.getElementById("mpin").value.trim();

  if (mpin === "") {
    document.getElementById("error").innerHTML = "Enter M_PIN";
    return;
  }

  document.getElementById("loader").style.display = "block";
  document.getElementById("error").innerHTML = "";

  fetch(API_URL + "?action=login&mpin=" + encodeURIComponent(mpin))
    .then(res => res.json())
    .then(data => {
      document.getElementById("loader").style.display = "none";
      if (data.status === "success") {
        sessionStorage.setItem("mpin", mpin);
        sessionStorage.setItem("lmName", data.lmName);
        sessionStorage.setItem("tcList", JSON.stringify(data.tcList));
        window.location.href = "menu2.html"; // Redirects to menu2.html now
      } else {
        document.getElementById("error").innerHTML = data.message;
      }
    })
    .catch(err => {
      document.getElementById("loader").style.display = "none";
      document.getElementById("error").innerHTML = "Unable to connect.";
      console.error(err);
    });
}

document.getElementById("mpin").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    login();
  }
});
</script>

</body>
</html>
