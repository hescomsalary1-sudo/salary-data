<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Employee Info</title>

<!-- Google Fonts: Noto Sans Kannada & Plus Jakarta Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Lucide Modern Vector Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
/* --- MODERN AURORA GLASS DESIGN SYSTEM --- */
:root {
    --bg-dark: #07090e;
    --accent-indigo: #6366f1;
    --accent-cyan: #06b6d4;
    --accent-rose: #f43f5e;
    --accent-emerald: #10b981;
    --accent-amber: #f59e0b;
    --glass-card: rgba(18, 24, 38, 0.7);
    --glass-input: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-hover: rgba(255, 255, 255, 0.15);
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --radius-xl: 28px;
    --radius-lg: 24px;
    --radius-md: 14px;
    --font-stack: 'Noto Sans Kannada', 'Plus Jakarta Sans', sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

html, body {
    width: 100%;
    min-height: 100%;
    background-color: var(--bg-dark);
    font-family: var(--font-stack);
    color: var(--text-primary);
    overflow-x: hidden;
}

body {
    padding-bottom: calc(95px + env(safe-area-inset-bottom, 0px));
}

/* --- DYNAMIC AURORA GLOW ORBS --- */
.aurora-bg {
    position: fixed;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
}

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    animation: floatOrb 12s ease-in-out infinite alternate;
}

.orb-1 {
    width: 380px;
    height: 380px;
    top: -100px;
    left: -80px;
    background: radial-gradient(circle, #10b981 0%, #047857 100%);
}

.orb-2 {
    width: 320px;
    height: 320px;
    bottom: -60px;
    right: -60px;
    background: radial-gradient(circle, #06b6d4 0%, #3b82f6 100%);
    animation-delay: -6s;
}

@keyframes floatOrb {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 40px) scale(1.1); }
}

/* --- FIXED TOP HEADER --- */
.top {
    position: relative;
    padding: 24px 20px 20px;
    background: rgba(7, 9, 14, 0.85);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--glass-border);
    border-bottom-left-radius: var(--radius-xl);
    border-bottom-right-radius: var(--radius-xl);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
}

.header-title {
    font-size: 22px;
    font-weight: 700;
    margin-top: 2px;
    background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.header-sub {
    font-size: 11px;
    color: var(--accent-emerald);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
}

.icon-action-btn {
    width: 42px;
    height: 42px;
    border-radius: var(--radius-md);
    background: var(--glass-input);
    border: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-primary);
    transition: all 0.25s ease;
}

.icon-action-btn:hover {
    background: var(--glass-hover);
    border-color: var(--accent-emerald);
}

.icon-action-btn:active {
    transform: scale(0.92);
}

/* --- MAIN CONTAINER --- */
.container {
    padding: 16px;
    position: relative;
    z-index: 1;
    animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
}

.tabs {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* --- HERO NOMINATION CARD --- */
.hero-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(6, 182, 212, 0.25));
    border: 1px solid rgba(16, 185, 129, 0.35);
    border-radius: var(--radius-xl);
    padding: 22px 20px;
    color: white;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.25s ease;
}

.hero-card:hover {
    border-color: var(--accent-emerald);
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.35), rgba(6, 182, 212, 0.35));
}

.hero-card:active {
    transform: scale(0.97);
}

.hero-left h2 {
    margin: 8px 0 4px;
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
}

.hero-left p {
    font-size: 12px;
    color: var(--text-muted);
    max-width: 190px;
    line-height: 1.4;
}

.badge {
    background: rgba(245, 158, 11, 0.2);
    border: 1px solid rgba(245, 158, 11, 0.4);
    color: var(--accent-amber);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}

.hero-btn {
    margin-top: 14px;
    background: linear-gradient(135deg, var(--accent-emerald), #059669);
    color: #ffffff;
    padding: 8px 16px;
    border-radius: var(--radius-md);
    font-size: 12px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
}

.hero-icon-wrapper {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-emerald);
    flex-shrink: 0;
}

/* --- GLASS CARDS --- */
.card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--glass-card);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-xl);
    padding: 18px 16px;
    cursor: pointer;
    transition: all 0.25s ease;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
}

.card:hover {
    background: var(--glass-hover);
    border-color: rgba(255, 255, 255, 0.2);
}

.card:active {
    transform: scale(0.97);
}

.left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.icon-box {
    width: 48px;
    height: 48px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: white;
    box-shadow: 0 6px 15px rgba(0,0,0,0.3);
}

.cyan-bg {
    background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
}

.emerald-bg {
    background: linear-gradient(135deg, var(--accent-emerald), #059669);
}

.card-text h4 {
    margin: 0;
    font-size: 14px;
    color: var(--text-primary);
    font-weight: 600;
}

.card-text p {
    margin: 3px 0 0;
    font-size: 11px;
    color: var(--text-muted);
}

.circle-arrow {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--glass-input);
    border: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-emerald);
    flex-shrink: 0;
    transition: all 0.25s ease;
}

.card:hover .circle-arrow {
    border-color: var(--accent-emerald);
    transform: translateX(2px);
}

/* PAGE LOADER */
#loader {
    position: fixed;
    inset: 0;
    background: rgba(7, 9, 14, 0.85);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2000;
}

.spinner-ring {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: var(--accent-emerald);
    border-right-color: var(--accent-cyan);
    animation: spin 0.8s linear infinite;
}

.loading-text {
    margin-top: 15px;
    font-size: 13px;
    color: var(--text-primary);
    font-weight: 600;
    letter-spacing: 0.5px;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

/* --- BOTTOM FLOATING NAVBAR --- */
.navbar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 75px;
    background: rgba(7, 9, 14, 0.9);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--glass-border);
    border-top-left-radius: var(--radius-xl);
    border-top-right-radius: var(--radius-xl);
    box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 1000;
}

.nav-item {
    flex: 1;
    text-align: center;
    position: relative;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.nav-icon {
    color: var(--text-muted);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.nav-item span {
    display: block;
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
    transition: all 0.3s ease;
}

.nav-item.active .nav-icon {
    color: var(--accent-emerald);
    transform: translateY(-2px);
}

.nav-item.active span {
    color: var(--accent-emerald);
    font-weight: 600;
}

.nav-item.active::before {
    content: "";
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 3px;
    border-radius: 10px;
    background: var(--accent-emerald);
    box-shadow: 0 0 10px var(--accent-emerald);
}

.center-item {
    display: flex;
    justify-content: center;
    align-items: center;
}

.center-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: translateY(-16px);
}

.center-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-emerald) 0%, var(--accent-cyan) 100%);
    border: 3px solid var(--bg-dark);
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    font-weight: 700;
    box-shadow: 0 8px 24px rgba(16, 185, 129, 0.45);
    animation: float 2.5s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}

.center-text {
    font-size: 10px;
    margin-top: 4px;
    color: var(--accent-emerald);
    font-weight: 700;
}
</style>
</head>

<body>

<!-- AMBIENT BACKGROUND GLOWS -->
<div class="aurora-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
</div>

<!-- PAGE LOADER -->
<div id="loader">
    <div class="spinner-ring"></div>
    <div class="loading-text">Loading...</div>
</div>

<!-- TOP HEADER -->
<div class="top">
    <div>
        <div class="header-sub">Employee Forum</div>
        <div class="header-title">Employee Info.</div>
    </div>

    <div class="icon-action-btn" onclick="refreshApp()">
        <i data-lucide="rotate-cw" style="width: 18px; height: 18px;"></i>
    </div>
</div>

<!-- MAIN CONTENT CONTAINER -->
<div class="container">
    <div class="tabs">

        <!-- HERO NOMINATION CARD -->
        <div class="hero-card" onclick="openPage(0,'nomination_form.html')">
            <div class="hero-left">
                <div class="badge">
                    <i data-lucide="star" style="width: 12px; height: 12px;"></i> Important
                </div>
                <h2>Nomination</h2>
                <p>Add your family members and share percentage</p>
                <div class="hero-btn">
                    Get Started <i data-lucide="arrow-right" style="width: 14px; height: 14px;"></i>
                </div>
            </div>
            <div class="hero-icon-wrapper">
                <i data-lucide="users" style="width: 32px; height: 32px;"></i>
            </div>
        </div>

        <!-- OFFICIAL DETAILS -->
        <div class="card" onclick="openPage(1,'official_details.html')">
            <div class="left">
                <div class="icon-box cyan-bg">
                    <i data-lucide="file-badge" style="width: 22px; height: 22px;"></i>
                </div>
                <div class="card-text">
                    <h4>Official Details</h4>
                    <p>View and update your official employee records</p>
                </div>
            </div>
            <div class="circle-arrow">
                <i data-lucide="chevron-right" style="width: 18px; height: 18px;"></i>
            </div>
        </div>

        <!-- ENQUIRIES -->
        <div class="card" onclick="openPage(2,'enquiries.html')">
            <div class="left">
                <div class="icon-box emerald-bg">
                    <i data-lucide="help-circle" style="width: 22px; height: 22px;"></i>
                </div>
                <div class="card-text">
                    <h4>Enquiries</h4>
                    <p>Ask questions or get help from support</p>
                </div>
            </div>
            <div class="circle-arrow">
                <i data-lucide="chevron-right" style="width: 18px; height: 18px;"></i>
            </div>
        </div>

    </div>
</div>

<!-- FLOATING NAVBAR -->
<div class="navbar" id="navbar">
    <div class="nav-item" onclick="goTab(0,'home.html')">
        <div class="nav-icon"><i data-lucide="home" style="width: 20px; height: 20px;"></i></div>
        <span>Home</span>
    </div>

    <div class="nav-item" onclick="goTab(1,'forum.html')">
        <div class="nav-icon"><i data-lucide="message-square" style="width: 20px; height: 20px;"></i></div>
        <span>Forum</span>
    </div>

    <div class="nav-item center-item" onclick="goTab(99,'info.html')">
        <div class="center-wrapper">
            <div class="center-btn"><i data-lucide="zap" style="width: 22px; height: 22px;"></i></div>
            <div class="center-text">Smart Support</div>
        </div>
    </div>

    <div class="nav-item active" onclick="goTab(2,'employee.html')">
        <div class="nav-icon"><i data-lucide="user" style="width: 20px; height: 20px;"></i></div>
        <span>Employee</span>
    </div>

    <div class="nav-item" onclick="goTab(3,'resources.html')">
        <div class="nav-icon"><i data-lucide="folder" style="width: 20px; height: 20px;"></i></div>
        <span>Resources</span>
    </div>
</div>

<!-- SCRIPTS & ROUTING -->
<script>
// Initialize Lucide Icons
lucide.createIcons();

let isLoading = false;

function openPage(index, url) {
    if(isLoading) return;
    isLoading = true;

    let loader = document.getElementById("loader");
    if(loader) {
        loader.style.display = "flex";
        document.body.style.overflow = "hidden";
    }

    setTimeout(() => {
        window.location = url;
    }, 400);

    setTimeout(() => {
        isLoading = false;
        if(loader) {
            loader.style.display = "none";
            document.body.style.overflow = "";
        }
    }, 3000);
}

function goTab(index, url) {
    sessionStorage.setItem("navClick", "true");
    let loader = document.getElementById("loader");
    if(loader) {
        loader.style.display = "flex";
        document.body.style.overflow = "hidden";
    }

    setTimeout(function(){
        window.location.replace(url);
    }, 400);
}

function refreshApp() {
    let loader = document.getElementById("loader");
    if(loader) {
        loader.style.display = "flex";
    }
    setTimeout(function(){
        location.reload(true);
    }, 500);
}

window.onload = function() {
    let loader = document.getElementById("loader");
    if(loader) {
        loader.style.display = "none";
        document.body.style.overflow = "";
    }

    let page = location.pathname.split("/").pop() || "employee.html";

    document.querySelectorAll(".nav-item").forEach(item => {
        let match = item.getAttribute("onclick");
        if(match) {
            let urlMatch = match.match(/'(.*?)'/);
            if(urlMatch && urlMatch[1] === page) {
                item.classList.add("active");
            } else if (urlMatch && urlMatch[1] !== page) {
                item.classList.remove("active");
            }
        }
    });
};

(function () {
    let currentPage = location.pathname.split("/").pop() || "employee.html";
    const navPages = [
        "home.html",
        "forum.html",
        "info.html",
        "employee.html",
        "resources.html"
    ];

    if (navPages.includes(currentPage)) {
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            if (currentPage !== "home.html") {
                window.location.replace("home.html");
            }
        };
    }
})();

(function () {
    let isNavClick = sessionStorage.getItem("navClick");
    if(isNavClick === "true"){
        history.pushState(null, "", location.href);
        window.onpopstate = function () {
            window.location.replace("home.html");
        };
        sessionStorage.removeItem("navClick");
    }
})();
</script>

</body>
</html>
