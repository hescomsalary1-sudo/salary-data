<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LM Pending Arrears (> ₹500) - HESCOM Siddapur</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Noto Sans Kannada', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
}

body {
  background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
  min-height: 100vh;
  color: #f8fafc;
  padding-bottom: 30px;
  position: relative;
}

.bg-glow-1 {
  position: absolute;
  top: -100px;
  right: -50px;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(244, 63, 94, 0.25) 0%, rgba(0,0,0,0) 70%);
  pointer-events: none;
  z-index: 0;
}

.bg-glow-2 {
  position: absolute;
  bottom: 0;
  left: -80px;
  width: 350px;
  height: 350px;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(0,0,0,0) 70%);
  pointer-events: none;
  z-index: 0;
}

.navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  width: 100%;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-badge {
  width: 38px;
  height: 38px;
  background: linear-gradient(135deg, #f43f5e, #e11d48);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.2);
  flex-shrink: 0;
}

.brand-text h2 {
  font-size: 0.88rem;
  font-weight: 700;
  color: #f8fafc;
  line-height: 1.2;
}

.brand-text p {
  font-size: 0.7rem;
  color: #f43f5e;
  font-weight: 600;
}

.nav-buttons {
  display: flex;
  gap: 8px;
}

.btn-nav {
  background: rgba(255, 255, 255, 0.08);
  color: #e2e8f0;
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.75rem;
  font-weight: 600;
  transition: all 0.2s ease;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.btn-nav:active {
  transform: scale(0.95);
  background: rgba(255, 255, 255, 0.2);
}

.btn-logout {
  background: rgba(239, 68, 68, 0.15);
  color: #fca5a5;
  border: 1px solid rgba(239, 68, 68, 0.3);
}

.container {
  width: 100%;
  max-width: 520px;
  margin: 16px auto 0 auto;
  padding: 0 14px;
  position: relative;
  z-index: 10;
}

.info-card {
  background: linear-gradient(135deg, rgba(30, 27, 75, 0.6), rgba(15, 23, 42, 0.8));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
  margin-bottom: 16px;
  animation: fadeInDown 0.4s ease forwards;
}

.info-item label {
  font-size: 0.68rem;
  text-transform: uppercase;
  color: #94a3b8;
  letter-spacing: 0.8px;
  display: block;
  margin-bottom: 2px;
}

.info-item span {
  font-size: 1.1rem;
  font-weight: 700;
  color: #f43f5e;
  text-shadow: 0 2px 8px rgba(244, 63, 94, 0.3);
}

.controls-card {
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  padding: 14px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
  margin-bottom: 20px;
  animation: fadeInUp 0.4s ease forwards;
}

.form-group label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  color: #cbd5e1;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

input {
  width: 100%;
  padding: 11px 14px;
  font-size: 0.88rem;
  color: #f8fafc;
  background: rgba(30, 41, 59, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  outline: none;
  transition: all 0.2s ease;
}

input:focus {
  border-color: #f43f5e;
  background: rgba(30, 41, 59, 0.95);
  box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.2);
}

input::placeholder {
  color: #64748b;
}

.data-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.consumer-summary-card {
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-left: 4px solid #f43f5e;
  border-radius: 14px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
  cursor: pointer;
  transition: all 0.2s ease;
  animation: fadeInUp 0.3s ease forwards;
}

.consumer-summary-card:active {
  transform: scale(0.98);
  background: rgba(30, 41, 59, 0.9);
  border-color: rgba(244, 63, 94, 0.5);
}

.card-left {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 65%;
}

.rr-badge {
  font-size: 0.88rem;
  font-weight: 700;
  color: #38bdf8;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tc-tag {
  font-size: 0.68rem;
  font-weight: 600;
  color: #a7f3d0;
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid rgba(16, 185, 129, 0.3);
  padding: 2px 8px;
  border-radius: 6px;
  display: inline-block;
  width: fit-content;
}

.consumer-name {
  font-size: 0.82rem;
  color: #cbd5e1;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.cb-amount {
  font-size: 0.98rem;
  font-weight: 700;
  color: #f43f5e;
  text-align: right;
}

.cb-amount span {
  display: block;
  font-size: 0.62rem;
  color: #94a3b8;
  text-transform: uppercase;
  font-weight: 600;
}

.arrow-icon {
  width: 26px;
  height: 26px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  color: #94a3b8;
}

.empty-state {
  text-align: center;
  padding: 36px 20px;
  color: #94a3b8;
  background: rgba(15, 23, 42, 0.6);
  border-radius: 16px;
  border: 1px dashed rgba(255, 255, 255, 0.12);
  font-size: 0.85rem;
}

.empty-state-icon {
  font-size: 2rem;
  margin-bottom: 8px;
  opacity: 0.7;
}

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(2, 6, 23, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 200;
  justify-content: center;
  align-items: flex-end;
  padding: 0;
}

.modal-content {
  background: rgba(15, 23, 42, 0.95);
  border-top: 1px solid rgba(255, 255, 255, 0.15);
  border-top-left-radius: 20px;
  border-top-right-radius: 20px;
  width: 100%;
  max-width: 520px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  animation: slideUp 0.3s ease forwards;
  box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
}

.modal-header {
  padding: 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title h3 {
  font-size: 1rem;
  color: #38bdf8;
  font-weight: 700;
}

.modal-title p {
  font-size: 0.75rem;
  color: #94a3b8;
}

.btn-close-modal {
  background: rgba(255, 255, 255, 0.1);
  border: none;
  color: #f8fafc;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-body {
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.detail-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
  font-size: 0.82rem;
  gap: 12px;
}

.detail-row:last-child {
  border-bottom: none;
}

.detail-label {
  color: #94a3b8;
  font-weight: 500;
}

.detail-value {
  color: #f8fafc;
  font-weight: 600;
  text-align: right;
  word-break: break-word;
}

#loader-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(2, 6, 23, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 1000;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.spinner-container {
  position: relative;
  width: 42px;
  height: 42px;
  margin-bottom: 12px;
}

.spinner-outer {
  width: 100%;
  height: 100%;
  border: 3px solid rgba(244, 63, 94, 0.2);
  border-top-color: #f43f5e;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.spinner-inner {
  position: absolute;
  top: 6px;
  left: 6px;
  width: 24px;
  height: 24px;
  border: 3px solid rgba(255, 255, 255, 0.1);
  border-bottom-color: #818cf8;
  border-radius: 50%;
  animation: spin-reverse 0.5s linear infinite;
}

@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes spin-reverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }

#loader-text {
  font-size: 0.85rem;
  font-weight: 600;
  color: #f43f5e;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<div id="loader-overlay">
  <div class="spinner-container">
    <div class="spinner-outer"></div>
    <div class="spinner-inner"></div>
  </div>
  <div id="loader-text">Loading Arrears (> ₹500)...</div>
</div>

<div class="navbar">
  <div class="nav-brand">
    <div class="brand-badge">💰</div>
    <div class="brand-text">
      <h2>ಬಾಕಿ ವರದಿ (> ₹500)</h2>
      <p>HESCOM Siddapur</p>
    </div>
  </div>
  <div class="nav-buttons">
    <a href="menu2.html" class="btn-nav">Menu</a>
    <button class="btn-nav btn-logout" onclick="logout()">Logout</button>
  </div>
</div>

<div class="container">
  <div class="info-card">
    <div class="info-item">
      <label>LM Name</label>
      <span id="lmName" style="color: #38bdf8;">-</span>
    </div>
    <div class="info-item" style="text-align: right;">
      <label>Consumers (> ₹500 CB)</label>
      <span id="totalOver500">0</span>
    </div>
  </div>

  <div class="controls-card">
    <div class="form-group">
      <label for="searchBox">Filter List</label>
      <input type="text" id="searchBox" placeholder="Search RR No, TC, or Consumer Name...">
    </div>
  </div>

  <div id="dataContainer" class="data-container">
    <div class="empty-state">
      <div class="empty-state-icon">📋</div>
      <div>Loading consumers...</div>
    </div>
  </div>
</div>

<div id="consumerModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">
        <h3 id="modalRR">RR No: --</h3>
        <p id="modalName">Consumer Name</p>
      </div>
      <button class="btn-close-modal" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxzt8aQteGxi3fB6xR9o3Ca8PcBstiE5z8bsAekwOo5UP7_d9j12n956TGxWX0bC3d70A/exec";

const lmName = sessionStorage.getItem("lmName");
const userMpin = sessionStorage.getItem("mpin");
let rawTcList = JSON.parse(sessionStorage.getItem("tcList") || "[]");

if (!lmName) { 
  alert("Session expired. Please log in again."); 
  location.href = "login2.html"; 
}

document.getElementById("lmName").textContent = lmName;

const searchBox = document.getElementById("searchBox");
const dataContainer = document.getElementById("dataContainer");
const loaderOverlay = document.getElementById("loader-overlay");
const loaderText = document.getElementById("loader-text");

let currentConsumerList = [];

function showLoader(msg = "Loading...") {
  loaderText.textContent = msg;
  loaderOverlay.style.display = "flex";
}

function hideLoader() {
  loaderOverlay.style.display = "none";
}

function getVal(obj, keys) {
  for (let k of keys) {
    if (obj[k] !== undefined && obj[k] !== null && obj[k] !== "") return obj[k];
  }
  return "";
}

function parseAmount(val) {
  if (!val) return 0;
  const cleaned = String(val).replace(/,/g, '').trim();
  return parseFloat(cleaned) || 0;
}

// Check preloaded cache first for instant render
window.onload = async function() {
  const cachedData = sessionStorage.getItem("cachedArrearsData");
  
  if (cachedData) {
    // Instant render from preloaded background session
    currentConsumerList = JSON.parse(cachedData);
    document.getElementById("totalOver500").textContent = currentConsumerList.length.toLocaleString('en-IN');
    renderConsumerList(currentConsumerList);
  } else {
    // Fallback if user opened page before background fetch completed
    fetchLiveData();
  }
};

async function fetchLiveData() {
  let userTCs = rawTcList;

  if (!userTCs || userTCs.length === 0) {
    if (userMpin) {
      try {
        showLoader("Fetching assigned TCs...");
        const res = await fetch(`${API_URL}?action=getTCs&mpin=${encodeURIComponent(userMpin)}`);
        const data = await res.json();
        if (data.status === "success" && data.tcList) {
          userTCs = data.tcList;
          sessionStorage.setItem("tcList", JSON.stringify(userTCs));
        }
      } catch (e) {
        console.error(e);
      }
    }
  }

  if (!userTCs || userTCs.length === 0) {
    dataContainer.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">⚠️</div>
        <div>No TCs assigned to your MPIN/Account.</div>
      </div>`;
    return;
  }

  showLoader("Fetching arrears data...");

  try {
    const tcPromises = userTCs.map(tc => 
      fetch(`${API_URL}?action=rr&tc=${encodeURIComponent(tc)}`)
        .then(res => res.json())
        .then(data => ({ tc, data }))
        .catch(() => ({ tc, data: null }))
    );

    const tcResults = await Promise.all(tcPromises);
    let allRRItems = [];

    tcResults.forEach(item => {
      if (item.data && item.data.status === "success" && item.data.rrList) {
        item.data.rrList.forEach(r => {
          allRRItems.push({ tc: item.tc, rrno: r.rrno });
        });
      }
    });

    const consumerPromises = allRRItems.map(item => 
      fetch(`${API_URL}?action=consumer&rrno=${encodeURIComponent(item.rrno)}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.status === "success" && data.consumer) {
            const c = data.consumer;
            const cbVal = parseAmount(getVal(c, ["CB", "Closing Balance", "CB Amount", "BALANCE"]));

            if (cbVal > 500) {
              return {
                tc: item.tc,
                rrno: getVal(c, ["RR No", "RRNO"]) || item.rrno,
                name: getVal(c, ["Name", "Consumer Name", "NAME"]) || "N/A",
                cb: cbVal,
                fullData: c
              };
            }
          }
          return null;
        })
        .catch(() => null)
    );

    const over500List = (await Promise.all(consumerPromises)).filter(Boolean);

    // Save fetched result into cache
    sessionStorage.setItem("cachedArrearsData", JSON.stringify(over500List));
    
    hideLoader();
    currentConsumerList = over500List;
    document.getElementById("totalOver500").textContent = over500List.length.toLocaleString('en-IN');
    renderConsumerList(over500List);
  } catch (err) {
    hideLoader();
    alert("Error loading data.");
  }
}

function renderConsumerList(list) {
  dataContainer.innerHTML = "";

  if (list.length === 0) {
    dataContainer.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">✅</div>
        <div>No consumers found with Closing Balance > ₹500 in your TCs.</div>
      </div>`;
    return;
  }

  list.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "consumer-summary-card";
    card.setAttribute("data-search", `${item.rrno} ${item.name} ${item.tc}`);
    card.onclick = () => openModal(index);

    card.innerHTML = `
      <div class="card-left">
        <div class="rr-badge">📄 ${item.rrno}</div>
        <div class="tc-tag">TC: ${item.tc}</div>
        <div class="consumer-name">${item.name}</div>
      </div>
      <div class="card-right">
        <div class="cb-amount">
          <span>Balance CB</span>
          ₹ ${Math.round(item.cb).toLocaleString('en-IN')}
        </div>
        <div class="arrow-icon">➔</div>
      </div>
    `;

    dataContainer.appendChild(card);
  });
}

function openModal(index) {
  const item = currentConsumerList[index];
  if (!item) return;

  document.getElementById("modalRR").textContent = `RR No: ${item.rrno}`;
  document.getElementById("modalName").textContent = item.name;

  const modalBody = document.getElementById("modalBody");
  modalBody.innerHTML = "";

  const tcRow = document.createElement("div");
  tcRow.className = "detail-row";
  tcRow.innerHTML = `
    <span class="detail-label">TC Name/Code</span>
    <span class="detail-value" style="color: #10b981;">${item.tc}</span>
  `;
  modalBody.appendChild(tcRow);

  Object.keys(item.fullData).forEach(key => {
    let val = item.fullData[key];
    if (val === null || val === undefined || val === "") val = "-";

    const row = document.createElement("div");
    row.className = "detail-row";
    row.innerHTML = `
      <span class="detail-label">${key}</span>
      <span class="detail-value">${val}</span>
    `;
    modalBody.appendChild(row);
  });

  document.getElementById("consumerModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("consumerModal").style.display = "none";
}

searchBox.onkeyup = function () {
  const term = this.value.toUpperCase().trim();
  const cards = document.querySelectorAll(".consumer-summary-card");

  cards.forEach(card => {
    const text = card.getAttribute("data-search").toUpperCase();
    card.style.display = text.includes(term) ? "flex" : "none";
  });
};

function logout() {
  showLoader("Logging out...");
  setTimeout(() => {
    sessionStorage.clear();
    location.href = "login2.html";
  }, 250);
}
</script>
</body>
</html>
