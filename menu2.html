<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LM Dashboard Menu - HESCOM Siddapur</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Noto Sans Kannada', 'Plus Jakarta Sans', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
}

body {
  /* Dynamic Multi-Layered Dark Background */
  background: radial-gradient(circle at 50% 0%, #fffaf5 0%, #f7ede2 50%, #e8d5c4 100%);
  min-height: 100vh;
  color: #f8fafc;
  padding-bottom: 30px;
  position: relative;
}

/* Ambient Background Accent Spheres */
.bg-glow-1 {
  position: absolute;
  top: -100px;
  right: -50px;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(0,0,0,0) 70%);
  pointer-events: none;
  z-index: 0;
}

.bg-glow-2 {
  position: absolute;
  bottom: 0;
  left: -80px;
  width: 350px;
  height: 350px;
  background: radial-gradient(circle, rgba(14, 165, 233, 0.25) 0%, rgba(0,0,0,0) 70%);
  pointer-events: none;
  z-index: 0;
}

/* Header Navbar */
.navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  width: 100%;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-badge {
  width: 38px;
  height: 38px;
  background: linear-gradient(135deg, #4f46e5, #0284c7);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.2);
  flex-shrink: 0;
}

.brand-text h2 {
  font-size: 0.85rem;
  font-weight: 700;
  color: #f8fafc;
  line-height: 1.2;
}

.brand-text p {
  font-size: 0.7rem;
  color: #38bdf8;
  font-weight: 600;
}

.btn-logout {
  background: rgba(239, 68, 68, 0.15);
  color: #fca5a5;
  border: 1px solid rgba(239, 68, 68, 0.3);
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.75rem;
  font-weight: 600;
  transition: all 0.2s ease;
  white-space: nowrap;
  flex-shrink: 0;
}

.btn-logout:active {
  transform: scale(0.95);
  background: rgba(239, 68, 68, 0.3);
}

/* Container */
.container {
  width: 100%;
  max-width: 500px;
  margin: 16px auto 0 auto;
  padding: 0 14px;
  position: relative;
  z-index: 10;
}

/* Welcome Header Card */
.welcome-card {
  background: linear-gradient(135deg, rgba(30, 27, 75, 0.6), rgba(15, 23, 42, 0.8));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  padding: 16px;
  text-align: center;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
  margin-bottom: 16px;
  animation: fadeInDown 0.5s ease forwards;
}

.welcome-card h3 {
  color: #94a3b8;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.welcome-card h1 {
  color: #38bdf8;
  font-size: 1.35rem;
  font-weight: 700;
  text-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);
}

/* Mobile-First 2-Column Grid */
.menu-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  width: 100%;
}

/* Grid Cards */
.menu-card {
  background: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 16px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 120px;
  text-decoration: none;
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
  transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  opacity: 0;
  animation: fadeInUp 0.5s ease forwards;
}

/* Stagger Animation */
.menu-card:nth-child(1) { animation-delay: 0.05s; }
.menu-card:nth-child(2) { animation-delay: 0.10s; }
.menu-card:nth-child(3) { animation-delay: 0.15s; }
.menu-card:nth-child(4) { animation-delay: 0.20s; }

.menu-card:active {
  transform: scale(0.97);
  background: rgba(30, 41, 59, 0.85);
}

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.card-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
}

.arrow-badge {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  color: #94a3b8;
}

.card-text h4 {
  font-size: 0.9rem;
  color: #f8fafc;
  margin-bottom: 4px;
  font-weight: 600;
  line-height: 1.2;
}

.card-text p {
  font-size: 0.7rem;
  color: #94a3b8;
  line-height: 1.3;
}

/* Distinct Card Color Accents */
.card-1 { border-top: 3px solid #38bdf8; }
.card-1 .card-icon { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }

.card-2 { border-top: 3px solid #34d399; }
.card-2 .card-icon { background: rgba(52, 211, 153, 0.15); color: #34d399; }

.card-3 { border-top: 3px solid #fbbf24; }
.card-3 .card-icon { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }

.card-4 { border-top: 3px solid #c084fc; }
.card-4 .card-icon { background: rgba(192, 132, 252, 0.15); color: #c084fc; }

/* Navigation Loader Overlay */
#page-loader {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(2, 6, 23, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 1000;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.spinner-container {
  position: relative;
  width: 42px;
  height: 42px;
  margin-bottom: 12px;
}

.spinner-outer {
  width: 100%;
  height: 100%;
  border: 3px solid rgba(56, 189, 248, 0.2);
  border-top-color: #38bdf8;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.spinner-inner {
  position: absolute;
  top: 6px;
  left: 6px;
  width: 24px;
  height: 24px;
  border: 3px solid rgba(255, 255, 255, 0.1);
  border-bottom-color: #818cf8;
  border-radius: 50%;
  animation: spin-reverse 0.5s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes spin-reverse {
  0% { transform: rotate(360deg); }
  100% { transform: rotate(0deg); }
}

.loader-text {
  font-size: 0.85rem;
  color: #38bdf8;
  font-weight: 600;
}

/* Keyframe Animations */
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-15px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<!-- Header Navbar -->
<div class="navbar">
  <div class="nav-brand">
    <div class="brand-badge">⚡</div>
    <div class="brand-text">
      <h2>ಕಾರ್ಯ ಮತ್ತು ಪಾಲನಾ ಶಾಖೆ</h2>
      <p>ಹೆಸ್ಕಾಂ, ಸಿದ್ದಾಪುರ</p>
    </div>
  </div>
  <button class="btn-logout" onclick="logout()">Logout</button>
</div>

<!-- Main Grid Container -->
<div class="container">
  
  <div class="welcome-card">
    <h3>Welcome Back</h3>
    <h1 id="lmNameDisplay">User</h1>
  </div>

  <div class="menu-grid">
    
    <!-- Button 1 -->
    <a href="display.html" class="menu-card card-1" onclick="handleNavigation(event, 'display.html')">
      <div class="card-top">
        <div class="card-icon">📋</div>
        <div class="arrow-badge">➔</div>
      </div>
      <div class="card-text">
        <h4>Display 1 Details</h4>
        <p>Consumer Information</p>
      </div>
    </a>

    <!-- Button 2 -->
    <a href="display2.html" class="menu-card card-2" onclick="handleNavigation(event, 'display2.html')">
      <div class="card-top">
        <div class="card-icon">📊</div>
        <div class="arrow-badge">➔</div>
      </div>
      <div class="card-text">
        <h4>Display 2 Details</h4>
        <p>Secondary Reports</p>
      </div>
    </a>

    <!-- Button 3 -->
    <a href="display3.html" class="menu-card card-3" onclick="handleNavigation(event, 'display3.html')">
      <div class="card-top">
        <div class="card-icon">⚡</div>
        <div class="arrow-badge">➔</div>
      </div>
      <div class="card-text">
        <h4>Display 3 Details</h4>
        <p>Feeder & Transformer</p>
      </div>
    </a>

    <!-- Button 4 -->
    <a href="display4.html" class="menu-card card-4" onclick="handleNavigation(event, 'display4.html')">
      <div class="card-top">
        <div class="card-icon">📂</div>
        <div class="arrow-badge">➔</div>
      </div>
      <div class="card-text">
        <h4>Display 4 Details</h4>
        <p>Tools & Records</p>
      </div>
    </a>

  </div>

</div>

<!-- Fullscreen Navigation Loader -->
<div id="page-loader">
  <div class="spinner-container">
    <div class="spinner-outer"></div>
    <div class="spinner-inner"></div>
  </div>
  <div class="loader-text">Loading Details...</div>
</div>

<script>
const lmName = sessionStorage.getItem("lmName");

if (!lmName) {
  alert("Session expired. Please log in again.");
  location.href = "login2.html";
} else {
  document.getElementById("lmNameDisplay").textContent = lmName;
}

function handleNavigation(event, targetUrl) {
  event.preventDefault();
  
  // Display Loader
  document.getElementById("page-loader").style.display = "flex";
  
  // Transition to target page
  setTimeout(() => {
    window.location.href = targetUrl;
  }, 300);
}

function logout() {
  document.getElementById("page-loader").style.display = "flex";
  document.querySelector(".loader-text").textContent = "Logging out...";
  
  setTimeout(() => {
    sessionStorage.clear();
    location.href = "login2.html";
  }, 250);
}
</script>

</body>
</html>
